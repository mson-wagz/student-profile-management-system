<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-400 via-purple-600 to to-pink-500">
    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <!-- Header -->
        <header class="bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl mb-8 p-6">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-700 text-center mb-6">
                Student Profile Management System
            </h1>
            <nav class="flex justify-center gap-4 flex-wrap">
                <button onclick="showPage('home')" class="nav-btn bg-gradient-to-r from-primary-500 to-primary-600 text-white shadow-lg px-6 py-3 rounded-full font-semibold transition-all duration-300 transform hover:scale-105">
                    🏠 Home
                </button>
                <button onclick="showPage('add-student')" class="nav-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-6 py-3 rounded-full font-semibold transition-all duration-300 transform hover:scale-105">
                    ➕ Add Student
                </button>
                <button onclick="showPage('view-students')" class="nav-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-6 py-3 rounded-full font-semibold transition-all duration-300 transform hover:scale-105">
                    👥 View Students
                </button>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl p-8">
            <!-- Home Page -->
            <div id="home" class="page">
                <div class="text-center">
                    <h2 class="text-3xl md:text-4xl font-bold text-gray-700 mb-4">
                        Welcome to Student Management
                    </h2>
                    <p class="text-gray-600 text-lg mb-8 max-w-2xl mx-auto">
                        Manage student profiles with ease. Add new students, view existing ones, and generate fun pseudonyms!
                    </p>
                    
                    <!-- Statistics Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 max-w-md mx-auto">
                        <div class="bg-gradient-to-br from-primary-500 to-primary-600 text-white p-6 rounded-2xl shadow-lg">
                            <h3 id="total-students" class="text-4xl font-bold mb-2">0</h3>
                            <p class="font-medium">Total Students</p>
                        </div>
                        <div class="bg-gradient-to-br from-secondary-500 to-secondary-600 text-white p-6 rounded-2xl shadow-lg">
                            <h3 id="total-courses" class="text-4xl font-bold mb-2">0</h3>
                            <p class="font-medium">Unique Courses</p>
                        </div>
                    </div>
                    
                    <!-- Quick Actions -->
                    <div class="flex justify-center gap-4 flex-wrap">
                        <button onclick="showPage('add-student')" class="bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white px-8 py-3 rounded-full font-semibold shadow-lg transform hover:scale-105 transition-all duration-300">
                            ➕ Add New Student
                        </button>
                        <button onclick="showPage('view-students')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-8 py-3 rounded-full font-semibold shadow-lg transform hover:scale-105 transition-all duration-300">
                            👥 View All Students
                        </button>
                    </div>
                </div>
            </div>

            <!-- Add Student Page -->
            <div id="add-student" class="page hidden">
                <h2 class="text-3xl font-bold text-gray-700 text-center mb-8">Add New Student</h2>
                <form id="student-form" class="max-w-md mx-auto space-y-6" onsubmit="addStudent(event)">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            👤 Full Name:
                        </label>
                        <input type="text" id="student-name" required 
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none transition-colors duration-300 text-gray-700">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            📧 Email:
                        </label>
                        <input type="email" id="student-email" required 
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none transition-colors duration-300 text-gray-700">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            📚 Course:
                        </label>
                        <input type="text" id="student-course" required 
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none transition-colors duration-300 text-gray-700">
                    </div>
                    <div class="flex gap-4 pt-4">
                        <button type="submit" class="flex-1 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white py-3 rounded-xl font-semibold shadow-lg transform hover:scale-105 transition-all duration-300">
                            ✅ Add Student
                        </button>
                        <button type="button" onclick="clearForm()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-xl font-semibold shadow-lg transform hover:scale-105 transition-all duration-300">
                            🔄 Clear Form
                        </button>
                    </div>
                </form>
                <div id="form-message" class="mt-6 text-center"></div>
            </div>

            <!-- View Students Page -->
            <div id="view-students" class="page hidden">
                <h2 class="text-3xl font-bold text-gray-700 text-center mb-8">All Students</h2>
                
                <!-- Search Section -->
                <div class="mb-8 max-w-md mx-auto">
                    <input type="text" id="search-input" placeholder="🔍 Search students..." 
                           onkeyup="searchStudents(this.value)"
                           class="w-full px-6 py-3 border-2 border-gray-200 rounded-full focus:border-primary-500 focus:outline-none transition-colors duration-300 text-gray-700">
                </div>
                
                <!-- Students Grid -->
                <div id="students-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Students will be loaded here -->
                </div>
                
                <!-- No Students Message -->
                <div id="no-students" class="hidden text-center py-12">
                    <div class="text-6xl mb-4">📚</div>
                    <p class="text-gray-500 text-lg mb-4">No students found.</p>
                    <button onclick="showPage('add-student')" class="text-primary-600 hover:text-primary-700 font-semibold underline">
                        Add your first student!
                    </button>
                </div>
            </div>
        </main>

        <!-- Student Profile Modal -->
        <div id="student-profile" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden">
            <div class="flex items-center justify-center min-h-screen p-4">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                    <div class="relative p-8">
                        <button onclick="closeProfile()" class="absolute top-4 right-4 text-gray-400 hover:text-primary-600 text-3xl font-bold">
                            ×
                        </button>
                        <div id="profile-content">
                            <!-- Profile content will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
   
</body>
</html>
